; ShelfKit Hub-IP: an ESP32 that turns the hub's UART into a WebSocket.
; The ShelfKit-Server is the WS server; this dials in and pumps bytes both ways.
[common]
platform = espressif32
framework = arduino
monitor_speed = 115200
lib_deps =
  https://github.com/Links2004/arduinoWebSockets.git#2.6.1
build_flags =
  -Wall
  -Wno-unused-parameter

[env:esp32dev]
extends = common
board = esp32dev

[env:esp32-s2-mini]
extends = common
board = lolin_s2_mini
build_flags =
  ${common.build_flags} -DUART_TX_PIN=17 -DUART_RX_PIN=16 -DBOOT_PIN=35 -DRESET_PIN=36
